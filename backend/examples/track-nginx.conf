# Example only: merge the http-level definitions into the existing http {} block.
# Paths and backend upstream are placeholders, not production infrastructure.
log_format track_json escape=json
  '{"project":"$arg_project","event":"$arg_event","time":"$time_iso8601",'
  '"device_id":"$arg_device_id","distribution":"$arg_distribution",'
  '"is_self_use":"$arg_is_self_use","app_version":"$arg_app_version",'
  '"app_build":"$arg_app_build","operation_id":"$arg_operation_id",'
  '"stage":"$arg_stage","reason":"$arg_reason"}';

map $request_method $track_write {
  default 0;
  GET 1;
}

# Merge these exact locations into the existing HTTPS server {} block.
# Replace the sample path with the existing single current-file path shared read-only
# with Backend. Keep the existing HTTPS, proxy headers and API upstream settings.
server {
  listen 8080;
  server_name localhost;

  location = /track {
    if ($request_method != GET) { return 405; }
    access_log /var/log/nginx/track/events.jsonl track_json if=$track_write;
    add_header Cache-Control "no-store" always;
    return 204;
  }

  location = /api/track/trend {
    proxy_pass http://127.0.0.1:3001;
  }
  location = /api/track/shotmarker {
    proxy_pass http://127.0.0.1:3001;
  }
}
